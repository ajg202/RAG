[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-qa"
version = "0.1.0"
description = "Document Q&A (RAG) over uploaded PDFs"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=2.0",
    # "chromadb",
    # "anthropic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]